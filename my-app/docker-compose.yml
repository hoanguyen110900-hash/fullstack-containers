services:
  frontend:
    image: phonebook-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile

  backend:
    image: phonebook-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/phonebook
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
